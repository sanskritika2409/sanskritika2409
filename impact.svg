<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Key results" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
<style>
.c{fill:#0b1226;stroke:#1e3a5f;stroke-width:1.5}
.v{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:46px;font-weight:800;fill:url(#g)}
.l{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;fill:#94a3b8;letter-spacing:1px}
.k{opacity:0;animation:u .9s ease-out forwards}
@keyframes u{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style></defs>
<g class="k" style="animation-delay:.1s"><rect class="c" x="20" y="15" width="275" height="120" rx="16"/><text class="v" x="157" y="77" text-anchor="middle">95%</text><text class="l" x="157" y="108" text-anchor="middle">RECALL · AML DETECTION</text></g>
<g class="k" style="animation-delay:.3s"><rect class="c" x="318" y="15" width="275" height="120" rx="16"/><text class="v" x="455" y="77" text-anchor="middle">10,000+</text><text class="l" x="455" y="108" text-anchor="middle">ACCOUNTS ANALYSED</text></g>
<g class="k" style="animation-delay:.5s"><rect class="c" x="616" y="15" width="275" height="120" rx="16"/><text class="v" x="753" y="77" text-anchor="middle">0.87</text><text class="l" x="753" y="108" text-anchor="middle">AUC-ROC · CHURN MODEL</text></g>
<g class="k" style="animation-delay:.7s"><rect class="c" x="914" y="15" width="266" height="120" rx="16"/><text class="v" x="1047" y="77" text-anchor="middle">10 wks</text><text class="l" x="1047" y="108" text-anchor="middle">IDEA → LIVE PRODUCT</text></g>
</svg>
