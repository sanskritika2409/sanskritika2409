<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Sanskritika Awasthi - Data Science and AI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset=".55" stop-color="#0f1b4d"/><stop offset="1" stop-color="#0b3a5b"/></linearGradient>
<linearGradient id="nm" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="gr" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
<style>
.e{stroke:#38bdf8;stroke-opacity:.45;stroke-width:1.2;stroke-dasharray:4 6;animation:fl 3s linear infinite}
.r{stroke:#f43f5e;stroke-opacity:.9;stroke-width:1.8;stroke-dasharray:5 5;animation:fl 1.4s linear infinite}
@keyframes fl{to{stroke-dashoffset:-20}}
.n{fill:#22d3ee;animation:pu 3s ease-in-out infinite}
.rn{fill:#f43f5e;animation:pu 1.4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.55}50%{opacity:1}}
.ring{fill:none;stroke:#f43f5e;stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:rg 2s ease-out infinite}
@keyframes rg{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.t{font-family:'Courier New',Consolas,monospace;font-size:24px;fill:#e2e8f0;opacity:0;animation:cy 12s infinite}
@keyframes cy{0%{opacity:0;transform:translateY(10px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
.cur{font-family:'Courier New',monospace;font-size:24px;fill:#22d3ee;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.fi{opacity:0;animation:fi 1.2s ease-out .2s forwards}
@keyframes fi{to{opacity:1}}
</style>
</defs>
<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="340" fill="url(#gr)"/>
<circle cx="900" cy="170" r="260" fill="url(#gl)"/>
<g>
<line class="e" x1="720" y1="70" x2="820" y2="120"/><line class="e" x1="820" y1="120" x2="930" y2="80"/>
<line class="e" x1="930" y1="80" x2="1040" y2="130"/><line class="e" x1="1040" y1="130" x2="1120" y2="60"/>
<line class="e" x1="820" y1="120" x2="790" y2="230"/><line class="e" x1="790" y1="230" x2="900" y2="270"/>
<line class="e" x1="1040" y1="130" x2="1090" y2="250"/><line class="e" x1="1090" y1="250" x2="990" y2="290"/>
<line class="e" x1="720" y1="70" x2="680" y2="180"/><line class="e" x1="680" y1="180" x2="790" y2="230"/>
<line class="e" x1="1120" y1="60" x2="1160" y2="170"/><line class="e" x1="1160" y1="170" x2="1090" y2="250"/>
<line class="e" x1="900" y1="270" x2="990" y2="290"/>
<line class="r" x1="900" y1="170" x2="960" y2="215"/><line class="r" x1="960" y1="215" x2="880" y2="225"/><line class="r" x1="880" y1="225" x2="900" y2="170"/>
<line class="r" x1="900" y1="170" x2="930" y2="80"/><line class="r" x1="900" y1="170" x2="820" y2="120"/><line class="r" x1="960" y1="215" x2="1040" y2="130"/><line class="r" x1="880" y1="225" x2="790" y2="230"/>
<circle class="n" cx="720" cy="70" r="6"/><circle class="n" cx="820" cy="120" r="8"/><circle class="n" cx="930" cy="80" r="7"/>
<circle class="n" cx="1040" cy="130" r="8"/><circle class="n" cx="1120" cy="60" r="5"/><circle class="n" cx="790" cy="230" r="7"/>
<circle class="n" cx="900" cy="270" r="6"/><circle class="n" cx="1090" cy="250" r="7"/><circle class="n" cx="990" cy="290" r="5"/>
<circle class="n" cx="680" cy="180" r="5"/><circle class="n" cx="1160" cy="170" r="5"/>
<circle class="rn" cx="900" cy="170" r="10"/><circle class="rn" cx="960" cy="215" r="7"/><circle class="rn" cx="880" cy="225" r="7"/>
<circle class="ring" cx="900" cy="170" r="10"/><circle class="ring" cx="960" cy="215" r="7" style="animation-delay:.6s"/><circle class="ring" cx="880" cy="225" r="7" style="animation-delay:1.2s"/>
</g>
<g class="fi">
<text x="60" y="120" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="1" fill="url(#nm)">SANSKRITIKA</text>
<text x="60" y="180" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="1" fill="url(#nm)">AWASTHI</text>
<text x="62" y="214" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" letter-spacing="4" fill="#94a3b8">DATA SCIENCE  ·  AI  ·  ANALYTICS  ·  FULL-STACK</text>
</g>
<text class="cur" x="62" y="268">&gt;</text>
<text class="t" x="90" y="268" style="animation-delay:0s">turning raw data into decisions</text>
<text class="t" x="90" y="268" style="animation-delay:3s">catching laundering rings with graphs</text>
<text class="t" x="90" y="268" style="animation-delay:6s">shipping ML systems that go live</text>
<text class="t" x="90" y="268" style="animation-delay:9s">SQL · Python · Power BI · FastAPI</text>
<text x="62" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#64748b">B.Tech CSE (Data Science &amp; AI) · SRMU Lucknow · Open to Data / ML / SWE roles</text>
</svg>

